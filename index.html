<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Stick Duel Arena</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      overflow: hidden;
      background: #151525;
      font-family: Arial, sans-serif;
    }

    canvas {
      display: block;
      background: linear-gradient(#82cfff 0%, #dff7ff 70%);
    }

    #help {
      position: fixed;
      top: 12px;
      left: 50%;
      transform: translateX(-50%);
      padding: 8px 14px;
      background: rgba(255, 255, 255, 0.85);
      border-radius: 8px;
      color: #222;
      font-size: 14px;
      z-index: 2;
    }

    #restart {
      display: none;
      position: fixed;
      top: 55%;
      left: 50%;
      transform: translate(-50%, -50%);
      padding: 13px 24px;
      border: 0;
      border-radius: 8px;
      background: #222;
      color: white;
      font-size: 18px;
      cursor: pointer;
      z-index: 3;
    }
  </style>
</head>

<body>
  <div id="help">
    Blue: A/D move, W jump, F attack |
    Red: Arrow keys move, Up jump, L attack
  </div>

  <button id="restart">Play again</button>
  <canvas id="game"></canvas>

  <script>
    const canvas = document.getElementById("game");
    const ctx = canvas.getContext("2d");
    const restartButton = document.getElementById("restart");

    let W;
    let H;
    let ground;
    let gameEnded = false;

    const keys = {};

    window.addEventListener("keydown", event => {
      keys[event.key.toLowerCase()] = true;

      if ([
        "arrowup",
        "arrowdown",
        "arrowleft",
        "arrowright",
        " "
      ].includes(event.key.toLowerCase())) {
        event.preventDefault();
      }
    });

    window.addEventListener("keyup", event => {
      keys[event.key.toLowerCase()] = false;
    });

    function resize() {
      W = canvas.width = window.innerWidth;
      H = canvas.height = window.innerHeight;
      ground = H - 95;
    }

    window.addEventListener("resize", resize);
    resize();

    class Fighter {
      constructor(x, color, controls, name) {
        this.startX = x;
        this.color = color;
        this.controls = controls;
        this.name = name;
        this.reset();
      }

      reset() {
        this.x = this.startX;
        this.y = ground - 75;
        this.vx = 0;
        this.vy = 0;
        this.width = 32;
        this.height = 75;
        this.health = 100;
        this.facing = this.name === "BLUE" ? 1 : -1;
        this.attacking = false;
        this.attackTimer = 0;
        this.attackCooldown = 0;
        this.hitTimer = 0;
        this.onGround = false;
      }

      update(opponent) {
        if (this.health <= 0) return;

        const left = keys[this.controls.left];
        const right = keys[this.controls.right];
        const jump = keys[this.controls.jump];
        const attack = keys[this.controls.attack];

        this.vx = 0;

        if (left) {
          this.vx = -5;
          this.facing = -1;
        }

        if (right) {
          this.vx = 5;
          this.facing = 1;
        }

        if (jump && this.onGround) {
          this.vy = -12;
          this.onGround = false;
        }

        if (attack && this.attackCooldown <= 0 && !this.attacking) {
          this.attacking = true;
          this.attackTimer = 14;
          this.attackCooldown = 28;
        }

        this.vy += 0.6;
        this.x += this.vx;
        this.y += this.vy;

        if (this.y + this.height >= ground) {
          this.y = ground - this.height;
          this.vy = 0;
          this.onGround = true;
        }

        this.x = Math.max(25, Math.min(W - 25, this.x));

        if (this.attackCooldown > 0) {
          this.attackCooldown--;
        }

        if (this.attackTimer > 0) {
          this.attackTimer--;
        } else {
          this.attacking = false;
        }

        if (this.hitTimer > 0) {
          this.hitTimer--;
        }

        if (this.attacking && this.attackTimer === 9) {
          this.tryHit(opponent);
        }
      }

      tryHit(opponent) {
        const attackDistance = 66;
        const distance = Math.abs(this.x - opponent.x);
        const facingOpponent =
          (opponent.x - this.x) * this.facing > 0;

        const verticalDistance = Math.abs(
          (this.y + this.height / 2) -
          (opponent.y + opponent.height / 2)
        );

        if (
          distance < attackDistance &&
          verticalDistance < 65 &&
          facingOpponent &&
          opponent.hitTimer <= 0
        ) {
          opponent.health -= 12;
          opponent.health = Math.max(0, opponent.health);
          opponent.vx = this.facing * 10;
          opponent.vy = -5;
          opponent.hitTimer = 20;

          if (opponent.health <= 0) {
            endGame(this.name + " WINS!");
          }
        }
      }

      draw() {
        const x = this.x;
        const y = this.y;

        ctx.save();
        ctx.translate(x, y);

        if (this.hitTimer > 0 && this.hitTimer % 4 < 2) {
          ctx.globalAlpha = 0.45;
        }

        ctx.strokeStyle = this.color;
        ctx.fillStyle = this.color;
        ctx.lineWidth = 7;
        ctx.lineCap = "round";

        // Head
        ctx.beginPath();
        ctx.arc(0, 12, 13, 0, Math.PI * 2);
        ctx.fill();

        // Body
        ctx.beginPath();
        ctx.moveTo(0, 27);
        ctx.lineTo(0, 57);
        ctx.stroke();

        // Legs
        ctx.beginPath();
        ctx.moveTo(0, 57);
        ctx.lineTo(-18, 75);
        ctx.moveTo(0, 57);
        ctx.lineTo(18, 75);
        ctx.stroke();

        // Arms
        ctx.beginPath();

        if (this.attacking) {
          ctx.moveTo(0, 34);
          ctx.lineTo(this.facing * 48, 30);
        } else {
          ctx.moveTo(0, 34);
          ctx.lineTo(-22, 50);
        }

        ctx.moveTo(0, 34);
        ctx.lineTo(22, 50);
        ctx.stroke();

        ctx.restore();
      }
    }

    const blue = new Fighter(
      220,
      "#126cff",
      {
        left: "a",
        right: "d",
        jump: "w",
        attack: "f"
      },
      "BLUE"
    );

    const red = new Fighter(
      700,
      "#ef4056",
      {
        left: "arrowleft",
        right: "arrowright",
        jump: "arrowup",
        attack: "l"
      },
      "RED"
    );

    function drawHealthBar(x, y, fighter, alignRight = false) {
      const barWidth = 260;
      const barHeight = 23;

      ctx.fillStyle = "#222";
      ctx.fillRect(x, y, barWidth, barHeight);

      ctx.fillStyle = fighter.color;

      const healthWidth = barWidth * fighter.health / 100;

      if (alignRight) {
        ctx.fillRect(
          x + barWidth - healthWidth,
          y,
          healthWidth,
          barHeight
        );
      } else {
        ctx.fillRect(x, y, healthWidth, barHeight);
      }

      ctx.strokeStyle = "white";
      ctx.lineWidth = 3;
      ctx.strokeRect(x, y, barWidth, barHeight);

      ctx.fillStyle = "#222";
      ctx.font = "bold 15px Arial";
      ctx.textAlign = alignRight ? "right" : "left";
      ctx.fillText(
        fighter.name,
        alignRight ? x + barWidth : x,
        y - 7
      );
      ctx.textAlign = "left";
    }

    function drawArena() {
      // Clouds
      ctx.fillStyle = "rgba(255,255,255,0.65)";
      ctx.beginPath();
      ctx.arc(150, 130, 28, 0, Math.PI * 2);
      ctx.arc(185, 130, 38, 0, Math.PI * 2);
      ctx.arc(230, 135, 25, 0, Math.PI * 2);
      ctx.fill();

      ctx.beginPath();
      ctx.arc(W - 230, 170, 28, 0, Math.PI * 2);
      ctx.arc(W - 190, 170, 38, 0, Math.PI * 2);
      ctx.arc(W - 145, 175, 25, 0, Math.PI * 2);
      ctx.fill();

      // Ground
      ctx.fillStyle = "#4bb56a";
      ctx.fillRect(0, ground, W, H - ground);

      ctx.fillStyle = "#33894d";
      ctx.fillRect(0, ground, W, 10);

      // Platform
      ctx.fillStyle = "#80562d";
      ctx.fillRect(W / 2 - 180, ground - 22, 360, 22);

      ctx.fillStyle = "#b87a3d";
      ctx.fillRect(W / 2 - 180, ground - 22, 360, 7);
    }

    function endGame(message) {
      gameEnded = true;
      restartButton.textContent = message + " Play again";
      restartButton.style.display = "block";
    }

    function resetGame() {
      blue.reset();
      red.reset();
      gameEnded = false;
      restartButton.style.display = "none";
    }

    function draw() {
      ctx.clearRect(0, 0, W, H);

      drawArena();

      drawHealthBar(25, 70, blue);
      drawHealthBar(W - 285, 70, red, true);

      blue.draw();
      red.draw();

      if (gameEnded) {
        ctx.fillStyle = "rgba(0,0,0,0.45)";
        ctx.fillRect(0, 0, W, H);

        ctx.fillStyle = "white";
        ctx.font = "bold 42px Arial";
        ctx.textAlign = "center";
        ctx.fillText(
          blue.health <= 0 ? "RED WINS!" : "BLUE WINS!",
          W / 2,
          H / 2 - 45
        );
        ctx.textAlign = "left";
      }
    }

    function gameLoop() {
      if (!gameEnded) {
        blue.update(red);
        red.update(blue);
      }

      draw();
      requestAnimationFrame(gameLoop);
    }

    restartButton.addEventListener("click", resetGame);

    gameLoop();
  </script>
</body>
</html>
